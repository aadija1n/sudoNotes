<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0e0e11" />
  <title>sudoNotes</title>
  <meta name="description" content="sudoNotes · Static GitHub-hosted academic notes app with live block editing, KaTeX math authoring, tables, diagrams, and atomic commits." />
  <meta property="og:title" content="sudoNotes" />
  <meta property="og:description" content="sudoNotes · Static GitHub-hosted academic notes app with live block editing, KaTeX math authoring, tables, diagrams, and atomic commits." />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="lib/github-dark.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="subject.css" />
  <link rel="stylesheet" href="notes.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="stage.css" />
  <link rel="stylesheet" href="dock.css" />
  <link rel="stylesheet" href="editor.css" />
  <link rel="stylesheet" href="blocks.css" />
  <link rel="stylesheet" href="blockmenu.css" />
  <link rel="stylesheet" href="insertmenu.css" />
  <link rel="stylesheet" href="shortcuts.css" />
  <link rel="stylesheet" href="seltoolbar.css" />
  <link rel="stylesheet" href="lib/katex/katex.min.css" />
  <link rel="stylesheet" href="math.css" />
  <link rel="stylesheet" href="mathinput.css" />
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <!-- libraries, bundled in /lib so everything works offline (deferred scripts run in this order) -->
  <script defer src="lib/marked.umd.js"></script>
  <script defer src="lib/marked-footnote.umd.js"></script>
  <script defer src="lib/purify.min.js"></script>
  <script defer src="lib/highlight.min.js"></script>

  <!-- app -->
  <script defer src="config.js"></script>
  <script defer src="data.js"></script>
  <script defer src="math.js"></script>
  <script defer src="mathdata.js"></script>
  <script defer src="mathinput.js"></script>
  <script defer src="render.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="local.js"></script>
  <script defer src="github.js"></script>
  <script defer src="stage.js"></script>
  <script defer src="format.js"></script>
  <script defer src="smarttype.js"></script>
  <script defer src="blocks.js"></script>
  <script defer src="insertmenu.js"></script>
  <script defer src="tabletools.js"></script>
  <script defer src="imagetools.js"></script>
  <script defer src="mermaid_footnotes.js"></script>
  <script defer src="qablock.js"></script>
  <script defer src="search_polish.js"></script>
  <script defer src="slashmenu.js"></script>
  <script defer src="shortcuts.js"></script>
  <script defer src="seltoolbar.js"></script>
  <script defer src="blockmenu.js"></script>
  <script defer src="editor.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
