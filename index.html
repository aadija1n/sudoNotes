<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0e0e11" />
  <title>Notes</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="lib/github-dark.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="subject.css" />
  <link rel="stylesheet" href="notes.css" />
  <link rel="stylesheet" href="auth.css" />
  <link rel="stylesheet" href="stage.css" />
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <!-- libraries, bundled in /lib so everything works offline (deferred scripts run in this order) -->
  <script defer src="lib/marked.umd.js"></script>
  <script defer src="lib/marked-footnote.umd.js"></script>
  <script defer src="lib/purify.min.js"></script>
  <script defer src="lib/highlight.min.js"></script>

  <!-- app -->
  <script defer src="config.js"></script>
  <script defer src="data.js"></script>
  <script defer src="render.js"></script>
  <script defer src="auth.js"></script>
  <script defer src="local.js"></script>
  <script defer src="github.js"></script>
  <script defer src="stage.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
